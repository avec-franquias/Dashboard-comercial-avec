<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugestões de Produto</title><style>
:root{--p:#5B4FE9;--t:#1f2937;--m:#6b7280;--l:#e5e7eb;--b:#f7f7fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--b);color:var(--t)}.w{max-width:1180px;margin:auto;padding:28px 22px 60px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.hero h1{margin:0 0 7px;font-size:30px}.hero p{margin:0;color:var(--m);max-width:720px;line-height:1.5}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer}.pri{background:var(--p);color:#fff}.ghost{background:#fff;border:1px solid var(--l)}.small{padding:7px 10px;font-size:13px}.active{background:#eceafe;color:#3f35b8}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.kpi,.card,.idea{background:#fff;border:1px solid var(--l);border-radius:14px}.kpi{padding:16px}.kpi small{display:block;color:var(--m);margin-bottom:8px}.kpi strong{font-size:27px}.g2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{padding:18px}.card h2{font-size:18px;margin:0 0 12px}.top{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f4}.rank{width:28px;height:28px;border-radius:8px;background:#f1f0ff;color:#4438ca;display:grid;place-items:center;font-weight:700}.grow{flex:1;min-width:0}.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow small,.hint{color:var(--m);font-size:12px}.barrow{margin:10px 0}.barlab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.inp{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 12px;min-height:40px}.search{flex:1;min-width:220px}.list{display:grid;gap:12px}.idea{padding:16px;display:grid;grid-template-columns:1fr auto;gap:16px}.idea h3{margin:0 0 5px;font-size:17px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:#f3f4f6}.status{background:#eef2ff;color:#4338ca}.desc{color:#4b5563;line-height:1.45;margin:8px 0}.subline{font-size:13px;color:var(--m)}.photo{width:84px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--l);cursor:pointer}.support{display:flex;align-items:center;gap:8px;margin-top:10px}.empty{padding:34px;text-align:center;color:var(--m);background:#fff;border:1px dashed var(--l);border-radius:14px}.mbg{position:fixed;inset:0;background:#11182799;display:grid;place-items:center;padding:18px;z-index:99}.modal{background:#fff;border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px}.modal h2{margin:0}.sub{color:var(--m);margin:5px 0 16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650}.field textarea{min-height:110px;resize:vertical}.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.similar{background:#fafafe;border:1px solid #ecebfa;border-radius:10px;padding:10px;margin-top:8px}.preview{max-width:180px;max-height:120px;border-radius:10px;border:1px solid var(--l);display:none}@media(max-width:800px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.idea{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.hero{flex-direction:column}}
</style></head><body><div class="w"><div class="hero"><div><h1>Sugestões de Produto</h1><p>Transforme pedidos de clientes em sinais claros para o roadmap. Apoie sugestões existentes para aumentar a relevância em vez de duplicar pedidos.</p></div><button class="btn pri" id="nova">+ Nova sugestão</button></div><div class="kpis"><div class="kpi"><small>Sugestões</small><strong id="kt">0</strong></div><div class="kpi"><small>Apoios</small><strong id="ka">0</strong></div><div class="kpi"><small>Franquias participando</small><strong id="kf">0</strong></div><div class="kpi"><small>Em andamento</small><strong id="ke">0</strong></div></div><div class="g2"><div class="card"><h2>Mais pedidas</h2><div id="ranking"></div></div><div class="card"><h2>Demanda por categoria</h2><div id="cats"></div></div></div><div class="tools"><input class="inp search" id="busca" placeholder="Buscar sugestão, cliente ou descrição"><select class="inp" id="fs"></select><select class="inp" id="fc"></select></div><div id="lista" class="list"><div class="empty">Carregando sugestões…</div></div></div><div id="modal"></div>
<script>
const API="https://nvehnztcxwcykhkoygbe.supabase.co/functions/v1/portal-roadmap";
const usuario=parent.portalUsuarioAtual?parent.portalUsuarioAtual():null;
let items=[];
const ST={recebida:"Recebida",em_analise:"Em análise",planejada:"Planejada",em_desenvolvimento:"Em desenvolvimento",concluida:"Concluída",nao_priorizada:"Não priorizada"};
const CATS=["Agenda","App","CRM","Financeiro","Marketing","Pagamentos","Relatórios","Site","Outros"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const date=s=>{try{return new Date(s).toLocaleDateString("pt-BR")}catch{return ""}};

async function api(action,payload={}){
  if(!usuario?.login) throw new Error("Usuário do Portal não identificado. Atualize a página.");
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,login:usuario.login,...payload})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error||"Não foi possível concluir.");
  return j;
}

function ideaCard(x){
  const admin=usuario?.papel==="admin";
  const status=admin
    ? '<select class="inp" style="padding:6px;font-size:12px" data-status="'+x.id+'">'+Object.entries(ST).map(([v,n])=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+n+'</option>').join("")+'</select>'
    : '<span class="pill status">'+esc(ST[x.status]||x.status)+'</span>';
  const excluir=admin?'<button class="btn small ghost" style="color:#b42318;border-color:#f0c7c3" data-delete="'+x.id+'">Excluir</button>':'';
  return '<div class="idea"><div><h3>'+esc(x.titulo)+'</h3><div class="meta"><span class="pill">'+esc(x.categoria)+'</span><span class="pill">Impacto '+esc(x.impacto)+'</span>'+status+'</div><div class="desc">'+esc(x.descricao)+'</div>'+(x.cliente?'<div class="subline">Cliente citado: <b>'+esc(x.cliente)+'</b></div>':'')+'<div class="subline">Enviado por '+esc(x.criado_por_nome||x.criado_por)+' · '+date(x.criado_em)+'</div><div class="support"><button class="btn small '+(x.meu_apoio?'active':'ghost')+'" data-support="'+x.id+'">'+(x.meu_apoio?'✓ Eu também preciso':'Eu também preciso')+'</button><b>'+(x.apoios||0)+' apoios</b>'+excluir+'</div></div>'+(x.imagem_url?'<img class="photo" src="'+esc(x.imagem_url)+'" data-photo="'+esc(x.imagem_url)+'" alt="Print da solicitação">':'')+'</div>';
}

function render(){
  const busca=$("busca"),fs=$("fs"),fc=$("fc");
  const q=(busca?.value||"").toLowerCase().trim();
  const st=fs?.value||"",cat=fc?.value||"";
  const fil=items.filter(x=>{
    const txt=(x.titulo+" "+x.descricao+" "+(x.cliente||"")).toLowerCase();
    return (!q||txt.includes(q))&&(!st||x.status===st)&&(!cat||x.categoria===cat);
  });
  $("kt").textContent=items.length;
  $("ka").textContent=items.reduce((a,x)=>a+(x.apoios||0),0);
  $("kf").textContent=new Set(items.map(x=>x.franquia_id).filter(Boolean)).size;
  $("ke").textContent=items.filter(x=>["planejada","em_desenvolvimento"].includes(x.status)).length;

  const top=[...items].sort((a,b)=>(b.apoios||0)-(a.apoios||0)).slice(0,5);
  $("ranking").innerHTML=top.length?top.map((x,i)=>'<div class="top"><span class="rank">'+(i+1)+'</span><div class="grow"><b>'+esc(x.titulo)+'</b><small>'+(x.apoios||0)+' apoios · '+esc(ST[x.status]||x.status)+'</small></div></div>').join(""):'<span class="hint">Ainda não há sugestões.</span>';

  const by={};
  items.forEach(x=>by[x.categoria]=(by[x.categoria]||0)+(x.apoios||1));
  const mx=Math.max(1,...Object.values(by));
  $("cats").innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div class="barrow"><div class="barlab"><span>'+esc(k)+'</span><b>'+v+'</b></div><div class="bar"><i style="width:'+Math.round(v/mx*100)+'%"></i></div></div>').join("")||'<span class="hint">Sem dados ainda.</span>';

  const atualCat=fc?.value||"";
  if(fc){
    const cats=[...new Set(items.map(x=>x.categoria).filter(Boolean))].sort();
    fc.innerHTML='<option value="">Todas as categorias</option>'+cats.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");
    if(cats.includes(atualCat)) fc.value=atualCat;
  }

  $("lista").innerHTML=fil.length?fil.map(ideaCard).join(""):'<div class="empty">Nenhuma sugestão encontrada.</div>';
  document.querySelectorAll("[data-support]").forEach(b=>b.onclick=()=>support(b.dataset.support));
  document.querySelectorAll("[data-photo]").forEach(i=>i.onclick=()=>showPhoto(i.dataset.photo));
  document.querySelectorAll("[data-status]").forEach(s=>s.onchange=()=>changeStatus(s.dataset.status,s.value));
  document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteIdea(b.dataset.delete));
}

async function load(){
  try{
    const j=await api("list");
    items=Array.isArray(j.items)?j.items:[];
    render();
  }catch(e){
    $("lista").innerHTML='<div class="empty">'+esc(e.message)+'</div>';
  }
}

async function support(id){
  try{await api("support",{id});await load()}catch(e){alert(e.message)}
}

async function changeStatus(id,status){
  try{
    const senha=parent.sessionStorage?.getItem("portal-admin-password")||"";
    await api("status",{id,status,senha});
    await load();
  }catch(e){alert(e.message);await load()}
}
async function deleteIdea(id){
  const item=items.find(x=>x.id===id);
  if(!confirm('Excluir a sugestão "'+(item?.titulo||"selecionada")+'"?\n\nOs apoios e a imagem anexada também serão removidos.')) return;
  try{
    const senha=parent.sessionStorage?.getItem("portal-admin-password")||"";
    await api("delete",{id,senha});
    await load();
  }catch(e){alert(e.message)}
}

function showPhoto(url){
  $("modal").innerHTML='<div class="mbg"><div class="modal" style="width:min(900px,100%)"><img src="'+esc(url)+'" style="width:100%;max-height:75vh;object-fit:contain"><div class="acts"><button class="btn ghost" id="fecharFoto">Fechar</button></div></div></div>';
  $("fecharFoto").onclick=()=>$("modal").innerHTML="";
}

function similares(t){
  const w=String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9]+/).filter(x=>x.length>3);
  if(w.length<2)return[];
  return items.map(x=>({x,n:w.filter(a=>x.titulo.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(a)).length/w.length}))
    .filter(z=>z.n>=.5).sort((a,b)=>b.n-a.n).slice(0,3).map(z=>z.x);
}

function openNew(){
  $("modal").innerHTML='<div class="mbg"><form class="modal" id="formNova"><h2>Nova sugestão</h2><p class="sub">Conte o problema do cliente. Vamos sinalizar pedidos semelhantes para evitar duplicidade.</p><div class="fields"><div class="field full"><label>Título</label><input class="inp" id="titulo" maxlength="140" required placeholder="Ex.: Confirmação automática de agenda pelo WhatsApp"><div id="similar"></div></div><div class="field"><label>Categoria</label><select class="inp" id="categoria">'+CATS.map(c=>'<option value="'+c+'">'+c+'</option>').join("")+'</select></div><div class="field"><label>Impacto percebido</label><select class="inp" id="impacto"><option value="baixo">Baixo</option><option value="medio" selected>Médio</option><option value="alto">Alto</option><option value="critico">Crítico</option></select></div><div class="field full"><label>Cliente que originou o pedido (opcional)</label><input class="inp" id="cliente" maxlength="160"></div><div class="field full"><label>Problema / necessidade</label><textarea class="inp" id="descricao" maxlength="2500" required></textarea></div><div class="field full"><label>Foto ou print (opcional)</label><input class="inp" id="imagem" type="file" accept="image/jpeg,image/png,image/webp"><span class="hint">JPG, PNG ou WEBP, até 3 MB.</span><img id="preview" class="preview"></div></div><div class="acts"><button type="button" class="btn ghost" id="cancelarNova">Cancelar</button><button class="btn pri" id="salvarNova">Enviar sugestão</button></div></form></div>';

  const titulo=$("titulo"),similar=$("similar"),imagem=$("imagem"),preview=$("preview"),form=$("formNova");
  titulo.oninput=()=>{
    const s=similares(titulo.value);
    similar.innerHTML=s.length?'<div class="similar"><b>Já existem sugestões parecidas:</b>'+s.map(x=>'<div style="margin-top:7px">'+esc(x.titulo)+' · '+(x.apoios||0)+' apoios <button type="button" class="btn small ghost" data-sim="'+x.id+'">Apoiar esta</button></div>').join("")+'</div>':"";
    document.querySelectorAll("[data-sim]").forEach(b=>b.onclick=async()=>{await support(b.dataset.sim);$("modal").innerHTML=""});
  };
  $("cancelarNova").onclick=()=>$("modal").innerHTML="";
  imagem.onchange=e=>{
    const f=e.target.files?.[0];
    if(f){preview.src=URL.createObjectURL(f);preview.style.display="block"}else preview.style.display="none";
  };
  form.onsubmit=async e=>{
    e.preventDefault();
    const btn=$("salvarNova");
    btn.disabled=true;btn.textContent="Enviando…";
    try{
      const f=imagem.files?.[0];
      let img="";
      if(f){
        if(f.size>3145728) throw new Error("A imagem deve ter no máximo 3 MB.");
        img=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=no;rd.readAsDataURL(f)});
      }
      await api("create",{titulo:$("titulo").value,descricao:$("descricao").value,cliente:$("cliente").value,categoria:$("categoria").value,impacto:$("impacto").value,imagem:img});
      $("modal").innerHTML="";
      await load();
    }catch(e){
      alert(e.message);
      btn.disabled=false;btn.textContent="Enviar sugestão";
    }
  };
}

function init(){
  const fs=$("fs"),fc=$("fc"),nova=$("nova"),busca=$("busca");
  fs.innerHTML='<option value="">Todos os status</option>'+Object.entries(ST).map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join("");
  fc.innerHTML='<option value="">Todas as categorias</option>';
  nova.onclick=openNew;
  busca.oninput=render;
  fs.onchange=render;
  fc.onchange=render;
  load();
}
init();
</script></body></html>
