name: Atualizar leads

on:
  workflow_dispatch:
    inputs:
      nicho:
        description: "Nicho (ex.: Salão de beleza)"
        required: false
        type: string
      cidade:
        description: "Cidade (ex.: Curitiba, PR)"
        required: false
        type: string
      bairro:
        description: "Bairro (opcional)"
        required: false
        type: string
      max_results:
        description: "Máximo de resultados"
        required: false
        default: "80"
        type: string

permissions:
  contents: write

concurrency:
  group: extrator-leads
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Coletar leads
        env:
          LEADS_NICHO: ${{ inputs.nicho }}
          LEADS_CIDADE: ${{ inputs.cidade }}
          LEADS_BAIRRO: ${{ inputs.bairro }}
          LEADS_MAX_RESULTS: ${{ inputs.max_results }}
        run: node collector/collect-leads.mjs
      - name: Salvar base atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserva o resultado coletado antes de sincronizar com o main,
          # evitando falha de push quando outro commit entra durante a coleta.
          rm -rf /tmp/extrator-data
          cp -a extrator-data /tmp/extrator-data

          git fetch origin main
          git reset --hard origin/main

          rm -rf extrator-data
          cp -a /tmp/extrator-data extrator-data

          git add extrator-data
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualiza base de leads"
            git push origin main
          fi
