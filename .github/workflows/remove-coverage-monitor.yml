name: Corrigir tela branca do portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-coverage-monitor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remover script que causou tela branca
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          pattern = re.compile(
              r'\n?<!-- portal-remove-monitoramento-cobertura -->\s*'
              r'<script>\s*\(function \(\) \{.*?\}\)\(\);\s*</script>\s*',
              re.S
          )

          novo, qtd = pattern.subn("\n", s, count=1)

          if qtd == 0:
              print("Bloco de regressao nao encontrado; nada a remover.")
              raise SystemExit(0)

          p.write_text(novo, encoding="utf-8")
          print("Bloco removido com sucesso.")

      - name: Commit da correcao
        run: |
          if git diff --quiet -- index.html; then
            echo "Sem alteracoes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Portal: corrige tela branca apos ajuste de cobertura"
          git push
