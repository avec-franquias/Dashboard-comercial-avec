name: Deploy Vercel prebuilt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'franquias-admin.js'
      - 'usuarios.json'
      - 'franquias/**'
      - 'api/**'
      - 'config/**'
      - 'portal-assets/**'
      - 'package.json'
      - 'vercel.json'
      - '.vercel-redeploy'
      - '.github/workflows/deploy-vercel-prebuilt.yml'

concurrency:
  group: vercel-prebuilt-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar token da Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Secret VERCEL_TOKEN nao configurado no repositorio."
            exit 2
          fi

          HTTP_CODE=$(curl -sS -o /tmp/vercel-user.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::VERCEL_TOKEN invalido, expirado ou sem acesso (HTTP $HTTP_CODE). Gere um novo token na Vercel e atualize o secret VERCEL_TOKEN no GitHub."
            exit 3
          fi

          echo "Token Vercel validado com sucesso."

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Vincular projeto existente
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${VERCEL_SCOPE:-}" ]; then
            vercel link --yes \
              --project dashboard-comercial-avec \
              --scope "$VERCEL_SCOPE" \
              --token "$VERCEL_TOKEN"
          else
            vercel link --yes \
              --project dashboard-comercial-avec \
              --token "$VERCEL_TOKEN"
          fi

      - name: Baixar configuracao de producao
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build fora da infraestrutura da Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Publicar prebuilt em producao
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
