name: Separar modulos do Portal
'on':
  push:
    branches:
      - main
    paths:
      - collector/split-portal-modules.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node collector/split-portal-modules.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html portal-assets/modulos
          git diff --cached --quiet && exit 0
          git commit -m "Portal: separa modulos para carregamento sob demanda"
          git push
