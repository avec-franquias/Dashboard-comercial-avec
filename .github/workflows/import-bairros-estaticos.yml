name: Importar base estatica nacional de bairros
'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/triggers/bairros-estatico-v2.txt']

permissions:
  contents: write

concurrency:
  group: bairros-base-estatica-v2
  cancel-in-progress: true

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 5}
      - name: Baixar dataset pronto
        run: git clone --depth 1 https://github.com/chandez/Estados-Cidades-IBGE.git /tmp/ibge
      - name: Converter base relacional
        shell: python
        run: |
          from pathlib import Path
          import csv,json,re,unicodedata
          root=Path('/tmp/ibge/csv')
          def rows(name):
              p=root/name
              txt=p.read_text(encoding='utf-8-sig')
              try: d=csv.Sniffer().sniff(txt[:8192],delimiters=',;')
              except: d=csv.excel
              return list(csv.DictReader(txt.splitlines(),dialect=d))
          def v(o,*ks):
              z={str(k).strip().lower():x for k,x in o.items()}
              for k in ks:
                  if k.lower() in z and z[k.lower()] not in (None,''): return str(z[k.lower()]).strip()
          def norm(s):
              s=unicodedata.normalize('NFD',str(s))
              s=''.join(c for c in s if unicodedata.category(c)!='Mn')
              return re.sub(r'\s+',' ',s.strip().lower())
          estados=rows('estados.csv'); cidades=rows('municipios.csv'); bairros=rows('bairros.csv')
          print('linhas:',len(estados),len(cidades),len(bairros))
          emap={}
          for x in estados:
              eid=v(x,'id','id_estado','codigo_uf','uf_id')
              uf=v(x,'uf','sigla')
              if eid and uf: emap[eid]=uf.upper()
          cmap={}
          for x in cidades:
              cid=v(x,'id','id_municipio','municipio_id','codigo_ibge')
              nome=v(x,'nome','municipio','cidade')
              eid=v(x,'estado','estado_id','id_estado','uf_id','codigo_uf')
              uf=v(x,'uf','sigla') or emap.get(eid)
              if cid and nome and uf: cmap[cid]=(uf.upper(),nome)
          out={}; usados=0
          for x in bairros:
              nome=v(x,'nome','bairro')
              cid=v(x,'municipio','municipio_id','id_municipio','cidade_id')
              if nome and cid in cmap:
                  uf,cidade=cmap[cid]
                  out.setdefault(uf,{}).setdefault(norm(cidade),[]).append(nome)
                  usados+=1
          if usados<1000:
              print('headers estados',list(estados[0]) if estados else [])
              print('headers cidades',list(cidades[0]) if cidades else [])
              print('headers bairros',list(bairros[0]) if bairros else [])
              print('amostra cidade',cidades[:2]); print('amostra bairro',bairros[:2])
              raise SystemExit(f'mapeamento insuficiente: {usados}')
          dest=Path('geo/bairros-br.json')
          atual=json.loads(dest.read_text(encoding='utf-8'))
          for uf,cs in out.items():
              atual.setdefault(uf,{})
              for c,arr in cs.items():
                  atual[uf][c]=sorted(set((atual[uf].get(c) or [])+arr),key=str.casefold)
          dest.write_text(json.dumps(atual,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          cidades_ok=sum(bool(a) for cs in atual.values() for a in cs.values() if isinstance(a,list))
          total=sum(len(a) for cs in atual.values() for a in cs.values() if isinstance(a,list))
          Path('geo/bairros-nacional-progresso.json').write_text(json.dumps({'fonte':'Estados-Cidades-IBGE + base existente','cidadesComBairros':cidades_ok,'bairros':total},ensure_ascii=False,indent=2),encoding='utf-8')
          print('OK importados',usados,'cidades',cidades_ok,'bairros',total)
      - name: Validar cidades criticas
        shell: python
        run: |
          import json,unicodedata,re
          d=json.load(open('geo/bairros-br.json'))
          def n(s):
              s=unicodedata.normalize('NFD',s); return re.sub(r'\s+',' ',''.join(c for c in s if unicodedata.category(c)!='Mn').lower().strip())
          for uf,c in [('PR','Curitiba'),('SC','Florianopolis'),('GO','Goiania')]:
              a=d.get(uf,{}).get(n(c),[])
              print(uf,c,len(a))
              if not a: raise SystemExit(f'Sem bairros: {c}/{uf}')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo/bairros-br.json geo/bairros-nacional-progresso.json
          git commit -m "Bairros: publica base nacional estatica validada" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
