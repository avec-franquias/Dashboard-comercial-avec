name: Corrigir renovacao sessao admin
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-admin-refresh.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar renovacao automatica
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.find("async function alterarPortal(fn, fnManut, mensagem){")
          end=s.find("// usuários deste navegador entram na lista do site",start)
          if start<0 or end<0:
              raise SystemExit("alterarPortal nao encontrado")
          new=r"""async function alterarPortal(fn, fnManut, mensagem){
  const base=clone(usuarios()), m=clone(MANUT||{});
  if(fn) await fn(base);
  if(fnManut) await fnManut(m);

  async function obterToken(forcar=false){
    let token=forcar ? '' : (localStorage.getItem('portal-admin-token')||'');
    if(token) return token;
    const login=perfil?.login||'';
    const senha=sessionStorage.getItem('portal-admin-password')||'';
    if(!login || !senha) throw new Error('Sua sessão administrativa precisa ser renovada. Saia e entre novamente.');
    const lr=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,senha})});
    let ld={}; try{ld=await lr.json()}catch{}
    if(!lr.ok || !ld.token) throw new Error(ld.error||'Não foi possível renovar a sessão administrativa.');
    localStorage.setItem('portal-admin-token',ld.token);
    return ld.token;
  }

  async function salvar(token){
    return fetch('/api/admin-state',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({
        instalacao:INSTALACAO,
        usuarios:base,
        manutencao:m,
        mensagem:mensagem||'Portal: atualizacao administrativa'
      })
    });
  }

  let token=await obterToken(false);
  let r=await salvar(token);
  if(r.status===401){
    localStorage.removeItem('portal-admin-token');
    token=await obterToken(true);
    r=await salvar(token);
  }

  let d={}; try{d=await r.json()}catch{}
  if(!r.ok) throw new Error(d.error||'Não foi possível salvar a alteração pelo Portal.');

  LISTA=Array.isArray(d.usuarios)?d.usuarios:base;
  MANUT=d.manutencao||m;
  TEM_ARQUIVO=true;
  rasc=null;
  try{localStorage.removeItem(RASC)}catch{}
  if(typeof avisoPublicar==='function') avisoPublicar();
  return LISTA;
}
"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding="utf-8")
      - name: Validar
        run: |
          grep -q "if(r.status===401)" index.html
          grep -q "portal-admin-password" index.html
          grep -q "/api/admin-state" index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Portal: renova sessao administrativa automaticamente"
          git push origin main
