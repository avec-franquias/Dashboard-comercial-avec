name: Remover cobertura seguro
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-coverage-safe.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste pontual
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="portal-hide-coverage-safe"
          if marker in s:
              print("Ajuste ja presente")
          else:
              block = """<!-- portal-hide-coverage-safe -->
          <script>
          (function(){
            function hideCoverage(){
              var nodes=document.querySelectorAll('div,section,aside,article');
              for(var i=0;i<nodes.length;i++){
                var el=nodes[i],t=(el.innerText||'').trim();
                if(t.length>1200) continue;
                if(!/Monitoramento/i.test(t)) continue;
                if(!(/GitHub Actions/i.test(t)||/Regi(?:ões|oes)/i.test(t))) continue;
                var nested=false;
                for(var j=0;j<el.children.length;j++){
                  var ct=(el.children[j].innerText||'').trim();
                  if(ct.length<1200 && /Monitoramento/i.test(ct) && (/GitHub Actions/i.test(ct)||/Regi(?:ões|oes)/i.test(ct))){nested=true;break;}
                }
                if(!nested){
                  el.style.setProperty('display','none','important');
                  el.setAttribute('data-portal-hidden','coverage');
                }
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hideCoverage,{once:true});else hideCoverage();
            setTimeout(hideCoverage,800);setTimeout(hideCoverage,2500);
          })();
          </script>
          """
              if "</body>" not in s:
                  raise SystemExit("HTML sem fechamento body; abortado sem alteracao")
              p.write_text(s.replace("</body>",block+"\n</body>",1),encoding="utf-8")
              print("Ajuste aplicado")
      - name: Validar
        run: grep -q "portal-hide-coverage-safe" index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Portal: oculta monitoramento de cobertura com seguranca"
            git push origin main
          fi
