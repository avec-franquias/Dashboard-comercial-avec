name: "Corrigir bairros no Extrator"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-bairros-estrutural-v2.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar funcao de bairros
        shell: python
        run: |
          from pathlib import Path
          import re, json, base64

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          m = re.search(r'(<script type="application/json" id="modulosEmbutidos">)([\s\S]*?)(</script>)', s)
          if not m:
              raise SystemExit("modulosEmbutidos nao encontrado")

          mods = json.loads(m.group(2))
          raw = base64.b64decode(mods["extrator"]).decode("utf-8")

          ini = raw.find("async function atualizarBairros(){")
          fim = raw.find("async function build(){", ini)
          if ini < 0 or fim < 0:
              raise SystemExit("atualizarBairros nao encontrado")

          new = """async function atualizarBairros(){
            const cidadeValor=String($('#cidade').value||'').trim();
            const estadoValor=String($('#estado').value||'').trim();

            const partes=cidadeValor.split(',');
            let nome=cidadeValor;
            let ufCidade='';
            if(partes.length>1){
              const fimCidade=String(partes.pop()||'').trim().toUpperCase();
              const mCidade=fimCidade.match(/[A-Z]{2}/);
              ufCidade=mCidade?mCidade[0]:'';
              nome=partes.join(',').trim();
            }

            const estadoNorm=estadoValor.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toUpperCase();
            const mEstado=estadoNorm.match(/^([A-Z]{2})(?:\\s|$|[-–—])/);
            const ufEstado=mEstado?mEstado[1]:'';
            const uf=ufCidade||ufEstado;

            opts('#bairro',['Carregando bairros...'],'Carregando bairros...');
            $('#bairro').disabled=true;

            let bairros=[];
            try{
              const r=await fetch('/api/bairros?uf='+encodeURIComponent(uf)+'&cidade='+encodeURIComponent(nome)+'&ts='+Date.now(),{cache:'no-store'});
              if(r.ok){
                const j=await r.json();
                bairros=Array.isArray(j.bairros)?j.bairros:[];
              }
            }catch(e){
              console.warn('Falha ao carregar bairros',e);
            }

            const conhecidos=unique('bairro').filter(x=>x&&x!=='Todos os bairros'&&x!=='Carregando bairros...');
            bairros=[...new Set([...bairros,...conhecidos])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'pt-BR'));

            opts('#bairro',['Todos os bairros',...bairros],'Todos os bairros');
            $('#bairro').disabled=false;
          }

"""

          raw = raw[:ini] + new + raw[fim:]
          mods["extrator"] = base64.b64encode(raw.encode("utf-8")).decode("ascii")
          s = s[:m.start(2)] + json.dumps(mods, ensure_ascii=False, separators=(",", ":")) + s[m.end(2):]
          p.write_text(s, encoding="utf-8")

      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada mudou"
            exit 0
          fi
          git commit -m "Extrator: corrige carregamento estrutural de bairros"
          git push
