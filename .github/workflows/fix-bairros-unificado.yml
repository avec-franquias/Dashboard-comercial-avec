name: Unificar bairros do Extrator
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bairros-unificado.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re,json,base64
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          m=re.search(r'(<script type="application/json" id="modulosEmbutidos">)([\s\S]*?)(</script>)',s)
          mods=json.loads(m.group(2))
          raw=base64.b64decode(mods["extrator"]).decode("utf-8")
          a=raw.find("async function atualizarBairros(){")
          b=raw.find("async function build(){",a)
          if a<0 or b<0: raise SystemExit("atualizarBairros nao encontrado")
          new=r"""async function atualizarBairros(){
            const cidade=$('#cidade').value;
            const partes=String(cidade||'').split(',');
            const ufCidade=(partes.pop()||'').trim().toUpperCase();
            const uf=String($('#estado').value||ufCidade||'').trim().toUpperCase();
            const nome=partes.join(',').trim()||String(cidade||'').replace(/,\s*[A-Z]{2}$/,'').trim();
            let bairros=[];
            opts('#bairro',['Carregando bairros...'],'Carregando bairros...');
            $('#bairro').disabled=true;
            try{
              const base=await carregarBaseBairros();
              bairros=base?.[uf]?.[chaveGeo(nome)]||[];
            }catch(e){}
            if(!bairros.length){
              try{
                const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),6500);
                const r=await fetch('/api/bairros?uf='+encodeURIComponent(uf)+'&cidade='+encodeURIComponent(nome)+'&ts='+Date.now(),{cache:'no-store',signal:ctrl.signal});
                clearTimeout(tm);
                if(r.ok){const j=await r.json();bairros=Array.isArray(j.bairros)?j.bairros:[]}
              }catch(e){}
            }
            const conhecidos=unique('bairro').filter(x=>x&&x!=='Todos os bairros'&&x!=='Carregando bairros...');
            bairros=[...new Set([...bairros,...conhecidos])].filter(Boolean).sort((x,y)=>x.localeCompare(y,'pt-BR'));
            opts('#bairro',['Todos os bairros',...bairros],'Todos os bairros');
            $('#bairro').disabled=false;
          }
"""
          raw=raw[:a]+new+raw[b:]
          mods["extrator"]=base64.b64encode(raw.encode()).decode()
          s=s[:m.start(2)]+json.dumps(mods,separators=(',',':'),ensure_ascii=False)+s[m.end(2):]
          p.write_text(s,encoding="utf-8")
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Portal: unifica carregamento de bairros do Extrator"
          git push origin main
