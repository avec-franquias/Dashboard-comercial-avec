name: Otimizar carregamento Portal
'on':
  push:
    branches:
      - main
    paths:
      - collector/optimize-portal-load.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node collector/optimize-portal-load.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Portal: carrega modulos somente quando usados"
          git push
