name: Corrigir bairros Extrator
'on':
  push:
    branches:
      - main
    paths:
      - collector/fix-bairros-extrator.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node collector/fix-bairros-extrator.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Extrator: corrige carregamento de bairros"
          git push
