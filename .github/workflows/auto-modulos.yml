name: Aplicar modulos automaticos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-modulos.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="const mods = (u.papel === 'admin' ? MODULOS : MODULOS.filter(m => (u.modulos || []).includes(m.id)))"
          new="const mods = MODULOS"
          if old in s:
              s=s.replace(old,new)
          else:
              candidates=[
                "MODULOS.filter(m => (u.modulos || []).includes(m.id))",
                "MODULOS.filter(m => (perfil.modulos || []).includes(m.id))"
              ]
              hit=False
              for x in candidates:
                  if x in s:
                      s=s.replace(x,"MODULOS")
                      hit=True
              if not hit:
                  raise SystemExit("Filtro de modulos nao encontrado")
          p.write_text(s,encoding="utf-8")
      - name: Validar
        run: |
          grep -q "const mods = MODULOS" index.html || grep -q "MODULOS" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "sem alteracoes"
          else
            git commit -m "Portal: libera novos modulos automaticamente para todos"
            git push origin main
          fi
