name: Inspecionar filtro modulos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-modulos.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["modulos ||","modulos||","MODULOS.filter","includes(m.id)","perfil.modulos","u.modulos"]:
            print("\n==",term,"==")
            pos=0
            for _ in range(12):
              i=s.find(term,pos)
              if i<0: break
              print(s[max(0,i-700):min(len(s),i+1300)])
              pos=i+len(term)
