name: Corrigir admin sem GitHub
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-no-github.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Substituir fluxo administrativo antigo
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="ADMIN_VERCEL_NATIVE_V1"
          if marker in s:
              print("Ajuste ja aplicado")
              sys.exit(0)

          pattern=re.compile(r"""async function alterarPortal\(fn, fnManut, mensagem\)\{.*?\n\}\n// usuários deste navegador entram na lista do site""",re.S)
          m=pattern.search(s)
          if not m:
              print("Funcao alterarPortal nao localizada com seguranca")
              sys.exit(2)

          novo=r'''async function alterarPortal(fn, fnManut, mensagem){
  /* ADMIN_VERCEL_NATIVE_V1 */
  const base = clone(usuarios());
  const m = clone(MANUT || {});
  if (fn) await fn(base);
  if (fnManut) await fnManut(m);

  const token = localStorage.getItem('portal-admin-token') || '';
  if (!token) throw new Error('Sua sessão administrativa precisa ser renovada. Saia e entre novamente no Portal.');

  const r = await fetch('/api/admin-state', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({
      instalacao: INSTALACAO,
      usuarios: base,
      manutencao: m,
      mensagem: mensagem || 'Portal: atualização administrativa'
    })
  });

  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || 'Não foi possível salvar a alteração pelo Portal.');

  LISTA = Array.isArray(d.usuarios) ? d.usuarios : base;
  MANUT = d.manutencao || m;
  TEM_ARQUIVO = true;
  rasc = null;
  try { localStorage.removeItem(RASC); } catch {}
  avisoPublicar();
  return LISTA;
}
// usuários deste navegador entram na lista do site'''

          s=pattern.sub(novo,s,count=1)

          # Remove qualquer convite/status de conexao manual ao GitHub da administracao.
          s=s.replace(
            "const on = !!(NO_SITE && perfil && perfil.papel === 'admin' && !ghCfg() && (rasc || !TEM_ARQUIVO));",
            "const on = false;"
          )
          s=s.replace(
            ": 'GitHub não conectado neste navegador. <button class=\"link\" id=\"btnConectar2\" style=\"font-size:14px\">Conectar agora</button>';",
            ": 'Alterações salvas automaticamente pelo Portal.';"
          )
          s=s.replace(
            "const c = $('#btnConectar2'); if (c) c.onclick = () => conectarGithub().then(() => desenhaUsuarios()).catch(() => {});",
            "const c = $('#btnConectar2'); if (c) c.remove();"
          )

          p.write_text(s,encoding="utf-8")
          print("Fluxo administrativo migrado para Vercel")

      - name: Validar
        shell: python
        run: |
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert "ADMIN_VERCEL_NATIVE_V1" in s
          bloco=s[s.index("async function alterarPortal"):s.index("// usuários deste navegador entram na lista do site")]
          assert "conectarGithub()" not in bloco
          assert "/api/admin-state" in bloco
          print("Validacao OK")

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Portal: administra manutencao e usuarios pela Vercel"
            git push origin main
          fi
