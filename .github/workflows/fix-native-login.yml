name: Corrigir login admin nativo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-native-login.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="$('#formLogin').onsubmit = async e => {"
          i=s.find(marker)
          if i<0: raise SystemExit("login nativo nao encontrado")
          start=i
          end=s.find("\n};",i)
          if end<0: raise SystemExit("fim login nao encontrado")
          end+=3
          new=r"""$('#formLogin').onsubmit = async e => {
  e.preventDefault();
  const login = normLogin($('#usuario').value), senha = $('#senha').value, msg = $('#msgLogin');
  msg.textContent = '';
  if (!login) { msg.textContent = 'Informe seu usuário.'; return $('#usuario').focus(); }
  if (!senha) { msg.textContent = 'Informe sua senha.'; return $('#senha').focus(); }
  const b = $('#btnEntrar'); b.disabled = true; b.textContent = 'Entrando…';
  try {
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login,senha})});
    let d={}; try{d=await r.json()}catch{}
    if(!r.ok) throw new Error(d.error||'Usuário ou senha incorretos.');
    const u=d.usuario;
    if(d.token) localStorage.setItem('portal-admin-token',d.token); else localStorage.removeItem('portal-admin-token');
    if(u?.papel==='admin') sessionStorage.setItem('portal-admin-password',senha);
    $('#senha').value='';
    entrarNoPortal(u);
  } catch(err) { msg.textContent=err.message||'Não foi possível entrar.'; }
  finally { b.disabled=false; b.textContent='Entrar'; }
};"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding="utf-8")
      - name: Validar
        run: |
          grep -q "portal-admin-token" index.html
          grep -q "/api/login" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Portal: integra login nativo com sessao administrativa"
          git push origin main
