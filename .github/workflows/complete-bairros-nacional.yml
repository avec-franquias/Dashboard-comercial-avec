name: Completar base nacional de bairros
'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/bairros-completar.txt'

permissions:
  contents: write

concurrency:
  group: bairros-nacional-complementar
  cancel-in-progress: true

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Completar lote nacional em paralelo
        env:
          BAIRROS_BATCH: '160'
          BAIRROS_CONCURRENCY: '8'
        run: node collector/update-bairros-nacional.mjs
      - name: Salvar progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo/bairros-br.json geo/bairros-nacional-progresso.json
          if git diff --cached --quiet; then
            echo "sem novos bairros neste lote"
            exit 0
          fi
          git commit -m "Bairros: completa lote nacional em paralelo"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
