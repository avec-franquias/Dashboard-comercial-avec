name: Completar base nacional de bairros
'on':
  push:
    branches:
      - main
    paths:
      - '.github/triggers/bairros-completar.txt'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: bairros-nacional-complementar
  cancel-in-progress: false

jobs:
  completar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Completar lote nacional
        env:
          BAIRROS_BATCH: '60'
        run: node collector/update-bairros-nacional.mjs
      - name: Salvar progresso
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geo/bairros-br.json geo/bairros-nacional-progresso.json
          if git diff --cached --quiet; then
            echo "sem novos bairros neste lote"
          else
            git commit -m "Bairros: completa lote da base nacional"
            git pull --rebase origin main\n          git push origin main
          fi
